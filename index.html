<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="calculator">
    <input id="display" type="text" disabled />
    <div class="button">
    <button onclick="clearLastItems()">AC</button>
    <button onclick="appendItems('0')">0</button>
    <button onclick="appendItems('1')">1</button>
    <button onclick="appendItems('2')">2</button>
    <button onclick="appendItems('3')">3</button>
    <button onclick="appendItems('4')">4</button>
    <button onclick="appendItems('5')">5</button>
    <button onclick="appendItems('6')">6</button>
    <button onclick="appendItems('7')">7</button>
    <button onclick="appendItems('8')">8</button>
    <button onclick="appendItems('9')">9</button>
    <button onclick="appendItems('+')">+</button>
    <button onclick="appendItems('-')">-</button>
    <button onclick="appendItems('/')">/</button> 
    <button onclick="appendItems('.')">.</button>
    <button onclick="clearItems()">C</button>
    <button onclick="appendItems('*')">*</button>
    <button class="equals" onclick="resultItems()">=</button>
    </div> 
    </div>
    <script src="index.js"></script>
</body>
</html>
